<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#131711">
<title>天命人 · 修行录</title>
<style>
:root{--bg:#11150f;--paper:#d6c7a3;--muted:#929a87;--gold:#c9aa66;--line:#b5a16c30;--head:KaiTi,STKaiti,"Kaiti SC",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font:14px/1.65 "Microsoft YaHei",sans-serif;background-image:radial-gradient(ellipse at 50% 0,#3b3b222e,transparent 65%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
button:focus-visible{outline:2px solid #dfbe74;outline-offset:5px}
[hidden]{display:none!important}
.shell{max-width:1700px;margin:auto;padding:0 38px}
header{height:94px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:15px}
.seal{display:grid;place-items:center;width:42px;height:48px;border:1px solid #af734f;color:#cc9470;font:31px var(--head);transform:rotate(-5deg)}
.brand h1{font:27px var(--head);letter-spacing:6px;margin:0}
.eyebrow{font-size:10px;letter-spacing:4px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(0,2.1fr);gap:36px;margin-top:28px}
.character{position:relative;overflow:hidden;min-height:730px;border-left:1px solid var(--line);border-right:1px solid var(--line);isolation:isolate;background:#202319}
.portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:90% center;z-index:-3}
.character:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#11150f 0%,#11150f20 42%,#11150f15 72%,#11150fbb 100%)}
.character:before{content:"";position:absolute;inset:12px;border:1px solid #b7a77525;z-index:-1;pointer-events:none}
.char-bottom{position:absolute;bottom:30px;padding:30px;width:100%}
.char-bottom h2{font:65px var(--head);letter-spacing:10px;margin:0;color:#e4d5b2}
.flourish{width:54px;height:1px;background:var(--gold);margin-bottom:13px}
.journey{min-width:0}
.board{display:grid;grid-template-columns:minmax(140px,.65fr) minmax(0,1.6fr);gap:28px}
.column{min-width:0}
.column+.column{border-left:1px solid var(--line);padding-left:26px}
.col-heading{font:27px var(--head);letter-spacing:5px;margin:0 0 24px}
.power-card{width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid var(--line)}
.power-card:hover,.skill-node:hover{color:#f4e5b8}
.power-card h4{font:21px var(--head);margin:0 0 3px;letter-spacing:2px}
.power-card small{font-size:11px;display:block;color:var(--muted)}
.totem{width:47px;height:47px;object-fit:contain;flex:none}
.skill-map{position:relative;width:100%;height:540px;margin-top:12px;background:radial-gradient(circle at center,#b39a4e12,transparent 52%)}
.dependency-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dependency-lines .edge{stroke:#c9aa66;stroke-width:1.4;fill:none;opacity:.85}
.skill-node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:clamp(110px,29%,150px);min-height:77px;padding:15px 9px;border:1px solid #ab945a77;background:#181d14f5;text-align:center;box-shadow:0 0 22px #0c100b;z-index:1;transition:border-color .2s,background .2s}
.skill-node:before,.skill-node:after{content:"";position:absolute;width:7px;height:7px;border-color:#c9aa66aa;border-style:solid}
.skill-node:before{top:-3px;left:-3px;border-width:1px 0 0 1px}
.skill-node:after{bottom:-3px;right:-3px;border-width:0 1px 1px 0}
.skill-node:hover{border-color:var(--gold);background:#24291b}
.skill-node h4{font:19px/1.4 var(--head);margin:0;letter-spacing:1px}
.skill-node small{display:block;font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:2px}
.skill-node.core{width:clamp(122px,33%,168px);min-height:96px;border-color:#cfb570c9;background:#292d1beF;box-shadow:0 0 35px #b49a5120}
.skill-node.core h4{font-size:23px;color:#e5d2a3}
.footer{margin-top:25px;border-top:1px solid var(--line);padding:20px 0;font-size:11px;color:#79806d}
dialog{color:var(--paper);background:#1b2118;border:1px solid #a3905e88;padding:0;max-width:560px;width:calc(100% - 35px);box-shadow:0 30px 100px #0008}
dialog::backdrop{background:#050903c7;backdrop-filter:blur(5px)}
.dialog-body{padding:32px}
.dialog-top{display:flex;align-items:start;justify-content:space-between}
.dialog-top h2{font:34px var(--head);margin:8px 0 12px}
.close{font-size:24px;color:var(--muted);padding:0 8px}
.detail-category{font-size:11px;letter-spacing:3px;color:var(--gold)}
.detail-copy{font-size:14px;line-height:1.9;color:#bbc0ac}
.formula{font:22px/1.8 Georgia,"Times New Roman",serif;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin:20px 0;color:#e7cf91;overflow-wrap:anywhere}
.detail-meta{font-size:12px;color:var(--muted);margin:8px 0}
@media(min-width:1500px){.layout{gap:50px}.board{gap:35px}.column+.column{padding-left:34px}.skill-map{height:610px}}
@media(max-width:1200px){.shell{padding:0 24px}.layout{grid-template-columns:260px minmax(0,1fr);gap:24px}.board{grid-template-columns:1fr;gap:28px}.column+.column{padding:25px 0 0;border-left:0;border-top:1px solid var(--line)}.divine-list{display:grid;grid-template-columns:1fr 1fr;gap:20px}.col-heading{margin-bottom:12px}.skill-map{height:400px}.character{min-height:760px}.char-bottom{padding:22px}.char-bottom h2{font-size:49px}}
@media(max-width:850px){.layout{display:block;margin-top:18px}.character{min-height:440px;height:440px;border:1px solid var(--line);margin-bottom:28px}.portrait{object-position:90% 35%}.char-bottom{max-width:360px;bottom:0}.char-bottom h2{font-size:52px}.character:after{background:linear-gradient(90deg,#11150fc9,transparent 85%),linear-gradient(0deg,#11150f,transparent 80%)}.skill-map{max-width:650px;margin:0 auto;height:440px}}
@media(max-width:560px){.shell{padding:0 18px}header{height:81px}.brand h1{font-size:23px;letter-spacing:3px}.eyebrow{font-size:8px;letter-spacing:2px}.seal{width:34px;height:39px;font-size:26px}.character{height:430px;min-height:430px}.divine-list{display:block}.power-card{padding:15px 0}.col-heading{font-size:25px}.skill-map{height:500px}.skill-node{width:120px;padding:12px 7px}.skill-node h4{font-size:16px}.skill-node.core{width:122px}.skill-node.core h4{font-size:21px}.dialog-body{padding:25px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const skills=[
{id:'eyes',type:'divine',name:'火眼金睛',tag:'函数图像',icon:ASSET_ICON,formula:'(x, f(x))',copy:'观察变化；图像用于猜想。',where:'第一回 · 第五节'},
{id:'substitution',type:'divine',name:'七十二变',tag:'换元法',icon:TRANSFORM_ICON,formula:'',copy:'重新选取变量，将极限化为熟悉的形式。',where:'第一回 · 第九节'},
{id:'definition',type:'skill',name:'极限定义',tag:'普攻',formula:'∀ ε > 0, ∃ N > 0, s.t. |aₙ − A| < ε if n > N',copy:'对任意 ε，选取 N 或 δ 作统一保证。',where:'第一回 · 第七节',position:[50,50]},
{id:'operations',type:'skill',name:'极限四则运算',tag:'连招',formula:'aₙ → A, bₙ → B；和、差、积、商',copy:'两个有限极限均存在；作商还须 B ≠ 0。',where:'第一回 · 第八节',position:[23,22]},
{id:'squeeze',type:'skill',name:'两边夹定理',tag:'夹击技',formula:'aₙ ≤ bₙ ≤ cₙ，aₙ、cₙ → A ⇒ bₙ → A',copy:'两侧趋于同一有限数，且最终夹住目标。',where:'第一回 · 第十节',position:[77,78]},
{id:'differentiate',type:'skill',name:'微分',tag:'变化率',formula:'',copy:'用极限刻画瞬时变化。',where:'第二回 · 微分',position:[77,22]},
{id:'integrate',type:'skill',name:'积分',tag:'累积',formula:'',copy:'用极限刻画累积量。',where:'第三回 · 积分',position:[23,78]}
];
// One course-wide learned list; earlier browser progress is left untouched.
const CURRENT_IDS=['eyes','substitution','definition','operations','squeeze'];
const dependencies=[
{from:'definition',to:'operations'},
{from:'definition',to:'squeeze'},
{from:'definition',to:'differentiate'},
{from:'definition',to:'integrate'}
];
const currentSkills=CURRENT_IDS.map(id=>skills.find(s=>s.id===id));
const $=id=>document.getElementById(id);
function skillButton(s,kind){
 const b=document.createElement('button');b.type='button';b.className=kind;b.dataset.skill=s.id;b.setAttribute('aria-label',s.name+'，查看用途');
 const wrap=document.createElement('div');const name=document.createElement('h4');name.textContent=s.name;
 const tag=document.createElement('small');tag.textContent=s.tag;wrap.append(name,tag);
 if(s.type==='divine'){const im=document.createElement('img');im.src=s.icon;im.className='totem';im.alt='';b.append(im);}
 else{b.style.setProperty('--x',s.position[0]+'%');b.style.setProperty('--y',s.position[1]+'%');if(s.id==='definition')b.classList.add('core');}
 b.append(wrap);b.addEventListener('click',()=>openDetail(s.id));return b;
}
function drawDependencies(){
 const map=$('skillMap'),bounds=map.getBoundingClientRect();if(!bounds.width||!bounds.height)return;
 $('dependencyLines').setAttribute('viewBox','0 0 '+bounds.width+' '+bounds.height);
 const nodes=new Map([...map.querySelectorAll('[data-skill]')].map(el=>[el.dataset.skill,el]));
 const paths=[];
 for(const edge of dependencies){
  if(!nodes.has(edge.from)||!nodes.has(edge.to))continue;
  const a=nodes.get(edge.from).getBoundingClientRect(),b=nodes.get(edge.to).getBoundingClientRect();
  const ax=a.left+a.width/2-bounds.left,ay=a.top+a.height/2-bounds.top;
  const bx=b.left+b.width/2-bounds.left,by=b.top+b.height/2-bounds.top;
  const dx=bx-ax,dy=by-ay;
  const leave=Math.min((a.width/2+7)/Math.abs(dx||.001),(a.height/2+7)/Math.abs(dy||.001));
  const enter=Math.min((b.width/2+8)/Math.abs(dx||.001),(b.height/2+8)/Math.abs(dy||.001));
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M'+(ax+dx*leave)+' '+(ay+dy*leave)+' L'+(bx-dx*enter)+' '+(by-dy*enter));
  path.setAttribute('class','edge');path.setAttribute('marker-end','url(#arrow)');path.dataset.from=edge.from;path.dataset.to=edge.to;paths.push(path);
 }
 $('dependencyEdges').replaceChildren(...paths);
}
$('divineList').replaceChildren(...currentSkills.filter(s=>s.type==='divine').map(s=>skillButton(s,'power-card')));
$('skillNodes').replaceChildren(...currentSkills.filter(s=>s.type==='skill').map(s=>skillButton(s,'skill-node')));
new ResizeObserver(drawDependencies).observe($('skillMap'));
document.fonts.ready.then(drawDependencies);
function openDetail(id){
 const s=currentSkills.find(s=>s.id===id);if(!s)return;
 $('detailTitle').textContent=s.name;$('detailCategory').textContent=s.type==='divine'?'神通':'技能';
 $('detailCopy').textContent=s.copy;$('detailFormula').textContent=s.formula;$('detailFormula').hidden=!s.formula;
 $('detailSource').textContent='出处：'+s.where;
 if(!$('detailDialog').open)$('detailDialog').showModal();
}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
</script>
