<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新工科数学分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.4;
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .image-container {
            width: 100%;
            height: 300px; /* 固定高度，避免过大 */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .custom-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            padding: 20px;
        }
        
        .title {
            padding: 25px 20px;
            text-align: center;
            background-color: white;
            border-bottom: 1px solid #eee;
        }
        
        .title h1 {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .main-content {
            --content-rail-width: 80%;
            column-count: 2;
            column-gap: 20px;
            margin-top: 20px;
        }

        .intro-link {
            display: block;
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            width: var(--content-rail-width);
            margin: 0 auto 8px;
            break-inside: avoid;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #d7dee7;
        }

        .section-divider span {
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        
        .chapter-card {
            background: white;
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.06);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            border: 1px solid #dbe4ee;
            min-height: 68px;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 100%;
        }
        
        .chapter-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
            border-color: #aac7e6;
        }
        
        .chapter-number {
            width: 40px;
            height: 40px;
            background: #2f7fbf;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 0;
            flex-shrink: 0;
            font-size: 16px;
        }
        
        .chapter-info {
            flex: 1 1 auto;
            max-width: none;
        }
        
        .chapter-info h3 {
            font-size: 17px;
            margin: 0;
            color: #2c3e50;
            line-height: 1.2;
        }
        
        .chapter-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: var(--content-rail-width);
            margin-bottom: 8px;
            margin-left: auto;
            margin-right: auto;
            break-inside: avoid;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                column-count: 1;
                --content-rail-width: 100%;
            }
            
            .title h1 {
                font-size: 24px;
            }
            
            .image-overlay {
                font-size: 28px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .title h1 {
                font-size: 22px;
            }
            
            .chapter-card {
                padding: 10px 12px;
                min-height: 66px;
            }

            .chapter-info {
                flex: 1 1 auto;
                max-width: none;
            }

            .chapter-info h3 {
                font-size: 15px;
                line-height: 1.2;
            }

            .chapter-number {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .intro-link {
                width: 100%;
            }
            
            .image-container {
                height: 200px;
            }
            
            .image-overlay {
                font-size: 24px;
            }
        }
    </style>
</head>

    <script>
        // 图片加载失败时的备用方案

            this.style.display = 'none';
            document.querySelector('.image-container').style.background = 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)';
            document.querySelector('.image-container').style.display = 'flex';
