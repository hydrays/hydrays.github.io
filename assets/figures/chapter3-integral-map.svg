<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img" aria-labelledby="title desc">
<title id="title">第三回积分知识脉络</title>
<desc id="desc">以积分的定义为核心，分为三条主线：牛顿—莱布尼茨公式（微积分基本定理）联系不定积分；基本积分公式与线性性质，依次联系换元法和分部积分法；微元法联系面积、体积、弧长与做功。图中使用无箭头连线。</desc>
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#35484a;text-anchor:middle;font-size:26px}
.box{fill:#f5f0e3;stroke:#7a8a85;stroke-width:1.6}
.root{fill:#e7ede6;stroke:#466d71;stroke-width:1.9}
.line{fill:none;stroke:#7a8a85;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.small{font-size:18px;fill:#66746c}
</style>
<path class="line" d="M345 72L155 142 M430 72V142 M515 72L710 142 M155 218V280 M430 218V280 M430 346V408 M710 218V280"/>
<rect class="box root" x="325" y="16" width="210" height="56" rx="4"/>
<text x="430" y="54" style="font-size:28px">积分的定义</text>
<rect class="box" x="20" y="142" width="270" height="76" rx="4"/>
<text x="155" y="174" style="font-size:24px">牛顿—莱布尼茨公式</text>
<text x="155" y="201" class="small" style="font-size:18px">（微积分基本定理）</text>
<rect class="box" x="320" y="142" width="220" height="76" rx="4"/>
<text x="430" y="174" style="font-size:26px">基本积分公式</text>
<text x="430" y="201" class="small" style="font-size:18px">线性性质</text>
<rect class="box" x="610" y="142" width="200" height="76" rx="4"/>
<text x="710" y="189" style="font-size:26px">微元法</text>
<rect class="box" x="55" y="280" width="200" height="66" rx="4"/>
<text x="155" y="324" style="font-size:26px">不定积分</text>
<rect class="box" x="340" y="280" width="180" height="66" rx="4"/>
<text x="430" y="324" style="font-size:26px">换元法</text>
<rect class="box" x="320" y="408" width="220" height="66" rx="4"/>
<text x="430" y="452" style="font-size:26px">分部积分法</text>
<rect class="box" x="590" y="280" width="240" height="82" rx="4"/>
<text x="710" y="312" style="font-size:25px">面积 · 体积</text>
<text x="710" y="345" style="font-size:25px">弧长 · 做功</text>
</svg>