<title id="title">累积面积与面积增量</title><desc id="desc">凹函数的曲线先上升后下降，金色窄条位于下降段。蓝灰色是累积面积A(x)，金色窄条是新增面积ΔA，虚线矩形的高为f(x)。</desc>
