    <text x="432" y="199">0.25</text><text x="504" y="199">0.5</text><text x="648" y="199">1</text>
  </g>
  <g class="number" text-anchor="end">
    <text x="347" y="44">6</text><text x="347" y="90">4</text><text x="347" y="136">2</text>
    <text x="347" y="228">−2</text><text x="347" y="274">−4</text><text x="347" y="320">−6</text>
    <text x="347" y="196">0</text>
  </g>
