<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">反比例函数在零附近的图像</title>
  <desc id="desc">横坐标从负一到一，纵坐标从负六到六。曲线在零处断开。横坐标为零点五、零点二五时，纵坐标分别为二、四；横坐标为负零点五、负零点二五时，纵坐标分别为负二、负四。横坐标越靠近零，函数值的绝对值越大。</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#8c7652" stroke-width="1.15"/></marker>
    <marker id="curve-arrow" markerWidth="9" markerHeight="9" refX="7.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8.5,4.5 L0,9 Z" fill="#37594b"/></marker>
    <style>
      text { fill: #544b3a; font-family: "Cambria Math", Cambria, "Times New Roman", serif; }
      .tick { stroke: #8c7652; stroke-width: 1; }
      .number { font-size: 15px; }
      .guide { fill: none; stroke: #b8a88d; stroke-width: 1; stroke-dasharray: 3 4; opacity: .65; }
      .branch { fill: none; stroke: #37594b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#curve-arrow); }
      .point { fill: #37594b; stroke: #f7f1e5; stroke-width: 1.7; }
    </style>
  </defs>
  <rect width="720" height="360" fill="#f2ead9"/>
  <rect x="44" y="20" width="632" height="315" rx="9" fill="#f7f1e5"/>
