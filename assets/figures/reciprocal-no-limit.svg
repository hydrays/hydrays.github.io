  <path d="M60,177 H670" fill="none" stroke="#8c7652" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
  <path d="M360,326 V25" fill="none" stroke="#8c7652" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#axis-arrow)"/>
  <g class="tick">
